; BMS CAN aggregator gateway - PlatformIO project (ESP-IDF framework, not Arduino).
;
; Build:          pio run
; First flash:    pio run -t upload            (USB, once)
; Serial monitor: pio device monitor
; Release .bin:   scripts/release.sh           (named from VERSION)

[platformio]
default_envs = bms-agg
src_dir = main

; =====================================================================
; TARGET - the ONE place to change chip and flash size.
;
;   board      : esp32dev (classic ESP32)  |  esp32-s3-devkitc-1 (ESP32-S3)
;   flash_size : 4MB | 8MB   (must match a file partitions/<size>.csv and
;                              config/sdkconfig.flash_<size>)
;
; After changing either value run `pio run -t fullclean` once, because the
; generated sdkconfig and CMake cache are per chip.
; =====================================================================
[target]
board = esp32dev
flash_size = 4MB

[env]
platform = espressif32
framework = espidf
board = ${target.board}
board_upload.flash_size = ${target.flash_size}
board_build.partitions = partitions/${target.flash_size}.csv
board_build.cmake_extra_args = -DBMS_FLASH_SIZE=${target.flash_size}
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; Packs web/, tracks VERSION, refreshes the build date (see the script).
extra_scripts = pre:tools/pio_prebuild.py

; The normal firmware.
[env:bms-agg]

; TEST ONLY: identical firmware whose post-OTA self-test always fails, so you
; can prove automatic rollback. Never ship this image.
; Build it with: scripts/release.sh --fail-selftest
[env:bms-agg-selftest-fail]
board_build.cmake_extra_args = -DBMS_FLASH_SIZE=${target.flash_size} -DBMS_FAIL_SELFTEST=1
